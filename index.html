<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытое пространство "4 сезона"</title>
    <style>
        :root {
            --bg-blur: 3px;
            --card-bg: rgba(255, 255, 255, 0.12);
            --card-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Inter", "Roboto", "-apple-system", BlinkMacSystemFont, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background-color: #0b0f19;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Задний фон */
        .parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: url('img/bg.jpg') no-repeat center/cover;
            filter: blur(var(--bg-blur)) brightness(0.5);
            z-index: -1;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* Верхняя правая шапка */
        header {
            width: 100%;
            padding: 30px 40px 10px 40px;
            display: flex;
            justify-content: flex-end;
        }

        .top-crests-container {
            display: flex;
            gap: 24px;
        }

        .crest-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 150px;
        }

        .crest-small {
            width: 60px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
            margin-bottom: 8px;
        }

        .crest-subtext {
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        /* Главный контент */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .main-crest-container {
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        /* Центральный логотип */
        .crest-main {
            width: 460px; /* Увеличили размер на ПК для солидности */
            height: auto;
            max-height: 340px;
            object-fit: contain;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.65));
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            image-rendering: -webkit-optimize-contrast;
        }
        
        .crest-main:hover {
            transform: scale(1.02);
        }

        /* Главный заголовок */
        h1 {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            margin-bottom: 45px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
            max-width: 900px;
            line-height: 1.15;
        }

        /* Сетка кнопок */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 24px;
            width: 100%;
            max-width: 1100px;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 30px 20px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
            min-height: 100px;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.22);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-4px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
        }

        /* Подвал */
        footer {
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            background: rgba(7, 11, 21, 0.6);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Адаптивность */
        @media (max-width: 992px) {
            h1 { font-size: 2.5rem; }
            .grid-container { grid-template-columns: repeat(2, 1fr); } 
            header { justify-content: center; padding: 20px; }
            .crest-main { width: 340px; }
        }

        @media (max-width: 576px) {
            header { padding: 20px 10px 10px 10px; justify-content: center; }
            .top-crests-container { gap: 20px; }
            .crest-small { width: 50px; height: 60px; margin-bottom: 4px; }
            .crest-subtext { font-size: 0.65rem; max-width: 110px; }

            .crest-main { 
                width: 85vw; 
                max-height: 38vh; 
            }

            h1 { 
                font-size: 1.7rem; 
                margin-bottom: 35px; 
            }

            .grid-container { 
                grid-template-columns: 1fr; 
                gap: 12px; 
                padding: 0 15px;
            } 
            
            .card { 
                padding: 18px 15px; 
                min-height: 70px; 
                font-size: 0.95rem; 
            }
        }
    </style>
</head>
<body>

    <div class="parallax-bg" id="bg"></div>

    <header>
        <div class="top-crests-container">
            <div class="crest-item">
                <img src="img/crest2.png" alt="Логотип ЦО" class="crest-small">
                <div class="crest-subtext">Ефремовский областной центр образования</div>
            </div>
            <div class="crest-item">
                <img src="img/crest3.png" alt="Герб Тульской области" class="crest-small">
                <div class="crest-subtext">Министерство образования Тульской области</div>
            </div>
        </div>
    </header>

    <main>
        <div class="main-crest-container">
            <img src="img/crest1.png" alt="Главный Логотип" class="crest-main">
        </div>

        <h1>Открытое пространство<br>"4 сезона"</h1>

        <div class="grid-container">
            <a href="early-age.html" class="card">Ранний возраст</a>
            <a href="preschool.html" class="card">Дошкольный возраст</a>
            <a href="schoolchildren.html" class="card">Младшие школьники</a>
            <a href="events.html" class="card">Мероприятия и конкурсы</a>
            <a href="recommendations.html" class="card">Рекомендации педагогов</a>
            <a href="reviews.html" class="card">Отзывы и предложения</a>
        </div>
    </main>

    <footer>
        ГОУ ТО "ЕФРЕМОВСКИЙ ОБЛАСТНОЙ ЦЕНТР ОБРАЗОВАНИЯ" &copy; 2026
    </footer>

    <script>
        const bg = document.getElementById('bg');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * -12;
            const y = (e.clientY / window.innerHeight) * -12;
            bg.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        });
    </script>

</body>
</html>
