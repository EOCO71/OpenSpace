<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытое пространство "4 сезона"</title>
    <style>
        :root {
            --bg-blur: 8px;
            --card-bg: rgba(255, 255, 255, 0.15);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #111;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Параллакс-эффект для фона */
        .parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            /* Плейсхолдер вместо фото учреждения. Замени на url('img/bg.jpg') */
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            background-size: cover;
            background-position: center;
            filter: blur(var(--bg-blur)) brightness(0.7);
            z-index: -1;
            transform: translate3d(0, 0, 0);
            will-change: transform;
        }

        /* Шапка с гербами */
        header {
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .crest-container {
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
        }

        .crest-placeholder {
            width: 40px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            text-align: center;
            /* Когда будут картинки гербов, раскомментируй строки ниже и удали текст: */
            /* background: url('img/crest1.png') no-repeat center/contain; */
        }

        /* Главный блок */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 40px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            line-height: 1.2;
        }

        /* Сетка кнопок */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            min-height: 90px;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-5px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }

        /* Футер */
        footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(5px);
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Адаптивность для мобилок */
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            header { justify-content: center; }
            .grid-container { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .grid-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- Задний фон для параллакса -->
    <div class="parallax-bg" id="bg"></div>

    <!-- Гербы справа вверху -->
    <header>
        <div class="crest-container">
            <div class="crest-placeholder">Герб 1</div>
            <div class="crest-placeholder">Герб 2</div>
            <div class="crest-placeholder">Герб 3</div>
        </div>
    </header>

    <!-- Основной контент -->
    <main>
        <h1>ОТКРЫТОЕ ПРОСТРАНСТВО<br>"4 СЕЗОНА"</h1>

        <div class="grid-container">
            <a href="#" class="card">ранний возраст</a>
            <a href="#" class="card">дошкольный возраст</a>
            <a href="#" class="card">младшие школьники</a>
            <a href="#" class="card">мероприятия и конкурсы</a>
            <a href="#" class="card">рекомендации педагогов</a>
            <a href="#" class="card">отзывы и предложения</a>
        </div>
    </main>

    <!-- Подвал -->
    <footer>
        ГОУ ТО "ЕФРЕМОВСКИЙ ОБЛАСТНОЙ ЦЕНТР ОБРАЗОВАНИЯ" &copy; 2026
    </footer>

    <!-- Легкий скрипт для параллакса при движении мыши -->
    <script>
        const bg = document.getElementById('bg');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * -20;
            const y = (e.clientY / window.innerHeight) * -20;
            bg.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        });
    </script>

</body>
</html>
